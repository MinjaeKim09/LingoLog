name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Release app
        run: xcodebuild -project LingoLog.xcodeproj -scheme LingoLog -configuration Release -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
